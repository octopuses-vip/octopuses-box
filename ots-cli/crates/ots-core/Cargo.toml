[package]
name = "ots-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ots-cli 领域层：循环状态机、工具抽象、审批策略与事件模型（零 IO）"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
globset = "0.4.20"
jsonschema = { version = "0.55.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
