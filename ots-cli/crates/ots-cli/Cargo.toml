[package]
name = "ots-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ots-cli 可执行程序：命令行接口、日志与进度、审计落盘"

[[bin]]
name = "ots"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
ots-config.workspace = true
ots-core.workspace = true
ots-llm.workspace = true
ots-sandbox.workspace = true
ots-tools.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "io-std", "io-util", "sync", "time", "process"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tempfile = "3.27.0"
