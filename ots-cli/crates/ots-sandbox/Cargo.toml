[package]
name = "ots-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ots-cli 审批沙箱：策略判定、操作预览、审批流程与执行隔离"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
globset = "0.4.20"
ots-config.workspace = true
ots-core.workspace = true
ots-tools.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["sync", "time", "fs", "io-std", "io-util", "macros", "rt", "rt-multi-thread"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
